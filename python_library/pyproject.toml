[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-usability"
version = "0.1.1"
description = "Ground-motion usability inference using the original saved model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<3", "scipy>=1.11", "scikit-learn==1.7.2", "lightgbm==4.6.0", "joblib>=1.3", "obspy>=1.4,<2"]

[project.scripts]
gm-usability = "gm_usability.cli:main"

[tool.setuptools.package-data]
gm_usability = ["data/*.sav"]

[tool.setuptools.packages.find]
include = ["gm_usability*"]
